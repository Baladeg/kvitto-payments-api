
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kvitto
      POSTGRES_PASSWORD: kvitto_local
      POSTGRES_DB: kvitto
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kvitto -d kvitto"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
