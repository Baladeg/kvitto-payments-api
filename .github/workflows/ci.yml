name: Ruff and pytest

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kvitto
          POSTGRES_PASSWORD: ci-only-database-password
          POSTGRES_DB: kvitto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kvitto -d kvitto_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://kvitto:ci-only-database-password@127.0.0.1:5432/kvitto_test
      TEST_DATABASE_URL: postgresql+psycopg://kvitto:ci-only-database-password@127.0.0.1:5432/kvitto_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project, pytest and Ruff
        run: python -m pip install -e ".[test]"

      - name: Ruff
        run: ruff check .

      - name: Integration tests on kvitto_test
        run: python -m pytest -q

      - name: Check dependencies
        run: python -m pip check
