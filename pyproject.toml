[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kvitto-payments"
version = "0.1.0"
description = "Payment REST API for the Kvitto Python assignment"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "SQLAlchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "email-validator>=2.2,<3",
    "uvicorn>=0.34,<1",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    # Starlette 1.x deprecates TestClient with httpx in favor of httpx2.
    "starlette>=0.46,<1",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
